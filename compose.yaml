services:
  vmodel:
    build: .
    ports:
      - "127.0.0.1:${VMODEL_HTTP_PORT:-4173}:4173"
    environment:
      VMODEL_ORIGIN: "http://localhost:${VMODEL_HTTP_PORT:-4173}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
