<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ene alpha measurement harness</title>
<style>body{margin:20px;background:#233046;color:#fff;font:14px system-ui}.row{display:flex;gap:12px}.cell{width:320px;height:320px;position:relative;overflow:hidden}.cell>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.checker{background:repeating-conic-gradient(#aaa 0% 25%,#eee 0% 50%) 50%/32px 32px}#black{background:#000}#white{background:#fff}#result{white-space:pre-wrap}</style>
<h1>Ene codec measurement</h1><p>This local diagnostic is separate from the final showcase.</p><div class="row"><div id="checker" class="cell checker"></div><div id="black" class="cell"></div><div id="white" class="cell"></div></div><pre id="result"></pre>
<script>
let media=[],mode='poster',userPaused=false,loadToken=0;
const boxes=[...document.querySelectorAll('.cell')];
function clear(){for(const e of media){if(e.tagName==='VIDEO'){e.pause();e.removeAttribute('src');e.load()}else e.removeAttribute('src');e.remove()}media=[]}
function event(e,name,ms=8000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{clean();reject(Error('timeout '+name))},ms);const ok=()=>{clean();resolve()};const fail=()=>{clean();reject(Error('media rejected'))};function clean(){clearTimeout(timer);e.removeEventListener(name,ok);e.removeEventListener('error',fail)}e.addEventListener(name,ok,{once:true});e.addEventListener('error',fail,{once:true})})}
async function alphaProbe(url){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';try{const loaded=event(v,'loadeddata',4000);v.src=url;await loaded;const c=document.createElement('canvas');c.width=c.height=32;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,32,32);const a=ctx.getImageData(0,0,1,1).data[3],b=ctx.getImageData(24,24,1,1).data[3];return{supported:a<16&&b>240,transparentAlpha:a,opaqueAlpha:b}}catch(e){return{supported:false,error:e.message}}finally{v.pause();v.removeAttribute('src');v.load()}}
async function poster(size=480){clear();mode='poster';for(const box of boxes){const im=new Image();const ready=event(im,'load');im.src=`/media/ene-spike-${size}-poster.webp`;box.append(im);media.push(im);await ready}}
async function play({codec='webm',size=480,quality,forceRejection=false,copies=3}={}){const token=++loadToken;clear();userPaused=false;mode=codec;let rejection=null;for(const box of boxes.slice(0,copies)){const e=codec==='webm'?document.createElement('video'):new Image();if(codec==='webm'){e.muted=true;e.playsInline=true;e.loop=true;e.autoplay=true}const ready=event(e,codec==='webm'?'loadeddata':'load');e.src=`/media/ene-spike-${size}-q${quality??(codec==='webm'?34:65)}.${codec}`;box.append(e);media.push(e);try{await ready;if(codec==='webm'){if(forceRejection)throw new DOMException('Injected autoplay rejection','NotAllowedError');await e.play()}}catch(err){rejection=err.name+': '+err.message;break}if(token!==loadToken)return}if(rejection){await poster(size);userPaused=true}return{mode,userPaused,rejection}}
async function pause(){userPaused=true;loadToken++;await poster();return state()}
function state(){return{mode,userPaused,count:media.length,video:media.filter(e=>e.tagName==='VIDEO').map(e=>{const q=e.getVideoPlaybackQuality?.();return{paused:e.paused,time:e.currentTime,quality:q?{totalVideoFrames:q.totalVideoFrames,droppedVideoFrames:q.droppedVideoFrames}:null}}),images:media.filter(e=>e.tagName==='IMG').map(e=>e.currentSrc)}}
async function choose(probe='/media/alpha-probe.webm'){const alpha=await alphaProbe(probe);await play({codec:alpha.supported?'webm':'webp'});return{alpha,mode}}
window.harness={alphaProbe,play,pause,poster,state,choose,ready:poster()};
</script></html>
